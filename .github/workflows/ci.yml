# Percurso — validação contínua mínima.
# A cada push/PR: testes unitários de domínio + bateria smoke contra o servidor
# no ar + avaliação do RAG (índice reconstruído das fontes versionadas) + camada
# de IA com stub (sem modelo: os GGUFs nunca entram no git).
# Sem npm install: o projeto não tem dependência externa (decisão técnica nº 1).
# AI_ENABLED fica explicitamente DESLIGADA nos passos do produto — os gates que
# exigem modelo real são gates de máquina local (ai/README.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  AI_ENABLED: "false"

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Testes unitários de domínio (banco temporário)
        run: node scripts/unit-test.mjs

      - name: Avaliação do RAG (reconstrói o índice e mede hit@5, citações, pt-BR, pseudonimização)
        run: node scripts/rag-test.mjs

      - name: Camada de IA com stub (contrato de 7 blocos, recusas, fila, fallbacks, Modo A)
        run: node scripts/ai-stub-test.mjs

      - name: Subir servidor com dados sintéticos
        run: |
          node server.js &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/sessao > /dev/null && break
            sleep 0.5
          done

      - name: Smoke tests do fluxo principal
        run: node scripts/smoke-test.mjs
