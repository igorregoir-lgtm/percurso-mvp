  <style>
/* Percurso — protótipo fiel ao Figma (mobile 390×844) */
:root{--bg:#e9e3d6;--card:#f7f0de;--chip:#efe3c8;--ink:#221e33;--muted:#77705e;--line:#d9cfb4;--terra:#cd4433;--musgo:#3e6b4f;--display:"Bricolage Grotesque",Georgia,serif;--sans:"Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#cfc8b8;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}.phone{max-width:390px;min-height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}@media(min-width:420px){.phone{min-height:844px;height:844px;border-radius:28px;box-shadow:0 20px 60px rgba(34,30,51,.18)}}.status{display:flex;align-items:center;justify-content:space-between;height:44px;padding:14px 24px 8px}.status time{font-size:14px;font-weight:600}.screen{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}.scroll{flex:1;overflow-y:auto;padding-bottom:12px}.pad{padding-left:24px;padding-right:24px}.h-welcome,.h-title{font-family:var(--display);font-weight:800;letter-spacing:-.02em}.h-welcome{font-size:28px;line-height:1.15}.h-title{font-size:24px;line-height:1.2}.label-up{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.sub{font-size:14px;color:var(--muted)}.metric-lg{font-family:var(--display);font-weight:800;font-size:28px;color:var(--musgo)}.metric-md{font-family:var(--display);font-weight:800;font-size:18px}.badge{display:inline-flex;background:var(--chip);color:var(--muted);font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}.card-gap{display:flex;flex-direction:column;gap:16px}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:14px 20px;border-radius:14px;font-size:15px;font-weight:700}.btn-primary{background:var(--terra);color:#fff}.btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn-aqui,.btn-faltou{min-width:55px;height:31px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:700;background:var(--card);border:1.5px solid var(--line);color:var(--muted)}.btn-aqui.on{background:#dde8de;border-color:var(--musgo);color:var(--musgo)}.btn-faltou.on{background:#f6dcd7;border-color:var(--terra);color:#a8341f}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 16px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar-fill{height:100%;background:var(--musgo)}.dock{flex-shrink:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px 4px;display:flex;justify-content:space-between}.dock-item{width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:500}.dock-item.active{color:var(--terra);font-weight:700}.dock-item svg{width:22px;height:22px}.home-ind{display:flex;justify-content:center;padding:12px 0 8px}.home-ind span{width:134px;height:5px;border-radius:10px;background:var(--ink);opacity:.3}.logo-block{text-align:center;padding:32px 24px 0}.logo-block .brand{font-family:var(--display);font-weight:800;font-size:36px}.logo-block .org{margin-top:6px;font-size:14px;font-weight:600;color:var(--muted)}.logo-block .rule{width:60px;height:2px;background:var(--terra);margin:14px auto 0;border:none}.profile-card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;width:100%;text-align:left}.avatar{width:48px;height:48px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px}.avatar.terra{background:#f6dcd7;color:var(--terra)}.avatar.musgo{background:#dde8de;color:var(--musgo)}.profile-card .info{flex:1}.profile-card .name{font-size:16px;font-weight:700}.profile-card .role{font-size:13px;color:var(--muted);margin-top:2px}.child-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:55px}.child-row .nome{flex:1;font-size:15px;font-weight:600}.child-row .actions{display:flex;gap:6px}.count-row{display:flex;gap:12px;padding:0 24px 16px}.count-badge{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:13px;font-weight:600}.count-badge .dot{width:8px;height:8px;border-radius:50%}.count-badge .dot.ok{background:var(--musgo)}.count-badge .dot.no{background:var(--terra)}.back{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--muted);padding:8px 0}.pending-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;text-align:left}.pending-item .dot{width:8px;height:8px;border-radius:50%;background:var(--terra);flex-shrink:0}.pending-item .txt{flex:1}.pending-item .t1{font-size:14px;font-weight:600}.pending-item .t2{font-size:12px;color:var(--muted);margin-top:2px}.behavior{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;text-align:left;font-size:15px;font-weight:600}.behavior.on{border-color:var(--musgo);background:#dde8de}.behavior .check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-left:auto;flex-shrink:0}.behavior.on .check{background:var(--musgo);border-color:var(--musgo);color:#fff}.note-box{width:100%;min-height:72px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;resize:none}.helper{display:flex;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}.helper .ribbon{width:4px;background:var(--terra);flex-shrink:0}.helper p{padding:12px;font-size:13px;color:var(--muted);line-height:1.4}.tag{display:inline-flex;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--muted)}.tag.ok{background:#dde8de;color:var(--musgo)}.tag.att{background:#f6dcd7;color:#a8341f}.turma-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;text-align:left}.turma-card .info{flex:1}.turma-card .name{font-size:16px;font-weight:700}.turma-card .tag{margin-top:6px}.toast-ok{display:flex;align-items:center;justify-content:center;gap:8px;background:#dde8de;color:var(--musgo);border-radius:12px;padding:12px;font-size:13px;font-weight:600}.footer-sticky{flex-shrink:0;padding:12px 24px 0}.stack-btns{display:flex;flex-direction:column;gap:10px}.hr{border:none;border-top:1px solid var(--line)}.metric-row{display:flex;justify-content:space-between;align-items:center;font-size:14px}.metric-row .k{font-weight:600}.metric-row .v{font-family:var(--display);font-weight:800;font-size:16px}.alert-list{display:flex;flex-direction:column;gap:8px}.alert-list p{font-size:14px;color:var(--muted)}.gap-12{gap:12px}.gap-16{gap:16px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}.flex-col{display:flex;flex-direction:column}.flex{display:flex}.items-center{align-items:center}.w-full{width:100%}
  </style>
</head>
<body>
  <div id="app" class="phone"></div>
  <script>
/* Percurso — protótipo Figma (standalone) */
const S=(p,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS={calendar:S('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/>'),users:S('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'),book:S('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'),grid:S('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'),back:S('<path d="M19 12H5M12 19l-7-7 7-7"/>',16),chevron:S('<path d="M9 18l6-6-6-6"/>',18),arrow:S('<path d="M5 12h14M12 5l7 7-7 7"/>',16),check:S('<path d="M20 6L9 17l-5-5"/>',12),heart:`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,signal:`<svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="1" y="10" width="3" height="5" rx=".5"/><rect x="5.5" y="7" width="3" height="8" rx=".5"/><rect x="10" y="4" width="3" height="11" rx=".5"/><rect x="14.5" y="1" width="3" height="14" rx=".5" opacity=".35"/></svg>`,wifi:S('<path d="M5 12.5a9 9 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1.2" fill="currentColor" stroke="none"/>',18),battery:`<svg width="24" height="18" viewBox="0 0 28 18" fill="none"><rect x="1" y="3" width="22" height="12" rx="2.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="5.2" width="16" height="7.6" rx="1" fill="currentColor"/><path d="M24 7v4a2 2 0 0 0 0-4z" fill="currentColor"/></svg>`};
const CRIANCAS=[{id:"1",nome:"Ana Clara",traj:"em acompanhamento",tag:"att"},{id:"2",nome:"Pedro Henrique",traj:"caminhando bem",tag:"ok"},{id:"3",nome:"Luísa",traj:"caminhando bem",tag:"ok"},{id:"4",nome:"Davi",traj:"em acompanhamento",tag:"att"},{id:"5",nome:"Beatriz",traj:"caminhando bem",tag:"ok"},{id:"6",nome:"João Miguel",traj:"caminhando bem",tag:"ok"}];
const ANCORAS=["Participou da roda com atenção","Brincou com outras crianças","Ficou mais quieta hoje","Pediu ajuda quando precisou","Trouxe algo de casa para mostrar"];
const TEMAS=["Roda","Brincadeira","História","Desenho","Música","Parque"];
const CLIMAS=["Calmo","Agitado","Alegre","Cansado"];
const state={user:null,chamada:Object.fromEntries(CRIANCAS.map(c=>[c.id,null])),temas:new Set(["Roda"]),climas:new Set(["Calmo"]),ancoras:new Set([ANCORAS[0]]),nota:"",salvoOlhar:false,folhaFechada:false};
const app=document.getElementById("app");
const statusBar=()=>`<div class="status" aria-hidden="true"><time>14:30</time><div class="icons">${ICONS.signal}${ICONS.wifi}${ICONS.battery}</div></div>`;
const homeInd=()=>`<div class="home-ind"><span></span></div>`;
function dock(active){const items=[["hoje","Hoje",ICONS.calendar],["chamada","Chamada",ICONS.users],["turma","Turma",ICONS.book],["mais","Mais",ICONS.grid]];return `<nav class="dock" aria-label="Navegação">${items.map(([id,label,icon])=>`<button type="button" class="dock-item ${active===id?"active":""}" data-go="${id}">${icon}<span>${label}</span></button>`).join("")}</nav>${homeInd()}`;}
const presentes=()=>Object.values(state.chamada).filter(v=>v==="P").length;
const faltaram=()=>Object.values(state.chamada).filter(v=>v==="F").length;
const nomesFaltaram=()=>CRIANCAS.filter(c=>state.chamada[c.id]==="F").map(c=>c.nome).join(", ")||"Ninguém";
function telaEntrada(){const perfis=[{nome:"Maria Silvia",papel:"Professora",papelKey:"professora",inicial:"M",avatar:"terra"},{nome:"Rita Amaral",papel:"Coordenação",papelKey:"coordenacao",inicial:"R",avatar:"musgo"},{nome:"Cleide Nunes",papel:"Professora",papelKey:"professora",inicial:"C",avatar:""}];app.innerHTML=`<div class="screen">${statusBar()}<div class="scroll"><div class="logo-block"><div class="brand">PERCURSO</div><div class="org">Instituto Social Ebenézer</div><hr class="rule"></div><div class="pad" style="margin-top:40px"><p class="h-title" style="font-size:18px;font-weight:700;font-family:var(--sans);margin-bottom:16px">Quem está registrando hoje?</p><div class="flex-col gap-12">${perfis.map(p=>`<button type="button" class="profile-card" data-perfil='${JSON.stringify(p)}'><div class="avatar ${p.avatar}">${p.inicial}</div><div class="info"><div class="name">${p.nome}</div><div class="role">${p.papel}</div></div><span class="chevron">${ICONS.chevron}</span></button>`).join("")}</div></div></div>${homeInd()}</div>`;app.querySelectorAll("[data-perfil]").forEach(btn=>btn.addEventListener("click",()=>{state.user=JSON.parse(btn.getAttribute("data-perfil"));go(state.user.papelKey==="coordenacao"?"painel":"hoje");}));}
function telaHoje(){const nome=state.user?.nome?.split(" ")[0]||"Maria";app.innerHTML=`<div class="screen"><div class="scroll">${statusBar()}<div class="pad" style="padding-top:16px"><h1 class="h-welcome">Boa tarde, ${nome}.</h1><p class="sub mt-8">Que bom ter você aqui hoje.</p></div><div class="pad mt-12"><div class="card"><div class="flex items-center gap-12" style="color:var(--muted)">${ICONS.book}<span style="font-size:14px;font-weight:700;color:var(--ink)">Turma da Tarde</span></div><p class="metric-md mt-12" style="font-size:18px">14h às 16h</p><p class="sub mt-8">14 crianças matriculadas</p></div></div><div class="pad mt-16 flex-col gap-12"><button type="button" class="btn btn-primary" data-nav="chamada">Fazer a chamada</button><button type="button" class="btn btn-secondary" data-nav="folha">Folha do dia</button><button type="button" class="btn btn-secondary" data-nav="olhar">Registrar um olhar</button></div><div class="pad mt-16"><p class="mb-8" style="font-size:14px;font-weight:700">Falta completar neste ciclo</p><div class="flex-col gap-12"><button type="button" class="pending-item" data-nav="olhar"><span class="dot"></span><span class="txt"><div class="t1">Olhar da Ana Clara</div><div class="t2">Faltam observações</div></span>${ICONS.arrow}</button><button type="button" class="pending-item" data-nav="folha"><span class="dot"></span><span class="txt"><div class="t1">Folha de terça-feira</div><div class="t2">Não preenchido</div></span>${ICONS.arrow}</button></div></div></div>${dock("hoje")}</div>`;bindNav();bindDock();}
function telaChamada(){if(Object.values(state.chamada).every(v=>v===null))CRIANCAS.forEach((c,i)=>{state.chamada[c.id]=i===3||i===5?"F":"P";});app.innerHTML=`<div class="screen"><div class="scroll">${statusBar()}<div class="pad"><button type="button" class="back" data-nav="hoje">${ICONS.back} Voltar</button><h1 class="h-title mt-8">Chamada - Turma da Tarde</h1></div><div class="count-row mt-12"><span class="count-badge"><span class="dot ok"></span>${presentes()} presentes</span><span class="count-badge"><span class="dot no"></span>${faltaram()} faltaram</span></div><div class="pad flex-col gap-12">${CRIANCAS.map(c=>`<div class="child-row"><span class="nome">${c.nome}</span><div class="actions"><button type="button" class="btn-aqui ${state.chamada[c.id]==="P"?"on":""}" data-id="${c.id}" data-v="P">Aqui</button><button type="button" class="btn-faltou ${state.chamada[c.id]==="F"?"on":""}" data-id="${c.id}" data-v="F">Faltou</button></div></div>`).join("")}</div></div><div class="footer-sticky"><button type="button" class="btn btn-primary" data-nav="folha">Salvar e abrir a folha do dia</button>${homeInd()}</div></div>`;app.querySelectorAll("[data-id]").forEach(btn=>btn.addEventListener("click",()=>{state.chamada[btn.dataset.id]=btn.dataset.v;telaChamada();}));bindNav();}
function telaFolha(){app.innerHTML=`<div class="screen"><div class="scroll">${statusBar()}<div class="pad"><button type="button" class="back" data-nav="hoje">${ICONS.back} Voltar</button><h1 class="h-title mt-8">Folha do dia - 19 de agosto</h1></div><div class="pad mt-16 flex-col gap-16"><div class="card" style="padding:14px"><p class="label-up" style="font-size:12px">Quem faltou</p><p class="mt-8" style="font-weight:600">${nomesFaltaram()}</p></div><div><p class="mb-8" style="font-size:14px;font-weight:700">O que fizemos</p><div class="chips">${TEMAS.map(t=>`<button type="button" class="chip ${state.temas.has(t)?"on":""}" data-tema="${t}">${t}</button>`).join("")}</div></div><div><p class="mb-8" style="font-size:14px;font-weight:700">Como foi o grupo</p><div class="chips">${CLIMAS.map(t=>`<button type="button" class="chip ${state.climas.has(t)?"on":""}" data-clima="${t}">${t}</button>`).join("")}</div></div><div class="helper"><div class="ribbon"></div><p>Aqui entra o encontro da turma. O que cada criança faz no colo não entra aqui.</p></div></div></div><div class="footer-sticky"><div class="stack-btns"><button type="button" class="btn btn-primary" id="fechar-folha">Fechar a folha</button><button type="button" class="btn btn-secondary" id="imprimir">Imprimir a folha</button></div>${homeInd()}</div></div>`;app.querySelectorAll("[data-tema]").forEach(btn=>btn.addEventListener("click",()=>{const t=btn.dataset.tema;state.temas.has(t)?state.temas.delete(t):state.temas.add(t);telaFolha();}));app.querySelectorAll("[data-clima]").forEach(btn=>btn.addEventListener("click",()=>{state.climas.clear();state.climas.add(btn.dataset.clima);telaFolha();}));document.getElementById("fechar-folha").onclick=()=>{state.folhaFechada=true;go("hoje");};document.getElementById("imprimir").onclick=()=>window.print();bindNav();}
function telaOlhar(){app.innerHTML=`<div class="screen"><div class="scroll">${statusBar()}<div class="pad" style="padding-top:8px"><button type="button" class="back" data-nav="hoje">${ICONS.back} Voltar</button><h1 class="h-title mt-8">Olhar de Ana Clara</h1></div><div class="pad mt-16"><p style="font-weight:600;font-size:15px">O que você viu neste encontro?</p></div><div class="pad mt-12 flex-col gap-12">${ANCORAS.map(a=>`<button type="button" class="behavior ${state.ancoras.has(a)?"on":""}" data-ancora="${a}"><span>${a}</span><span class="check">${state.ancoras.has(a)?ICONS.check:""}</span></button>`).join("")}</div><div class="pad mt-16"><p class="sub mb-8">Quer deixar uma nota? (Opcional)</p><textarea class="note-box" id="nota" placeholder="Escreva observações adicionais aqui...">${state.nota}</textarea></div><div class="pad mt-16 flex-col gap-12" style="padding-bottom:24px"><button type="button" class="btn btn-primary" id="salvar-olhar">Salvar o olhar</button>${state.salvoOlhar?`<div class="toast-ok">${ICONS.heart} Registro guardado com carinho.</div>`:""}</div></div>${homeInd()}</div>`;app.querySelectorAll("[data-ancora]").forEach(btn=>btn.addEventListener("click",()=>{const a=btn.dataset.ancora;state.ancoras.has(a)?state.ancoras.delete(a):state.ancoras.add(a);state.salvoOlhar=false;const n=document.getElementById("nota");if(n)state.nota=n.value;telaOlhar();}));document.getElementById("nota")?.addEventListener("input",e=>{state.nota=e.target.value;});document.getElementById("salvar-olhar")?.addEventListener("click",()=>{state.nota=document.getElementById("nota")?.value||"";state.salvoOlhar=true;telaOlhar();});bindNav();}
function telaTurma(){app.innerHTML=`<div class="screen"><div class="scroll">${statusBar()}<div class="pad" style="padding-top:20px"><h1 class="h-welcome">Turma da Tarde</h1><p class="sub mt-8">14 crianças matriculadas</p><hr class="hr" style="width:60px;margin-top:12px;border-color:var(--terra);border-width:2px"></div><div class="pad mt-16 flex-col gap-12">${CRIANCAS.map(c=>`<button type="button" class="turma-card" data-nav="olhar"><div class="info"><div class="name">${c.nome}</div><span class="tag ${c.tag}">${c.traj}</span></div><span class="chevron">${ICONS.chevron}</span></button>`).join("")}</div></div>${dock("turma")}</div>`;bindNav();bindDock();}
function telaPainel(){app.innerHTML=`<div class="screen"><div class="scroll">${statusBar()}<div class="pad" style="padding-top:16px"><h1 class="h-welcome">Boa tarde, Rita.</h1><span class="badge mt-8">Coordenação</span></div><div class="pad mt-16 card-gap"><div class="card"><p class="label-up">Presença da Casa</p><p class="metric-lg mt-12">87% esta semana</p><div class="bar-track mt-8"><div class="bar-fill" style="width:87%"></div></div></div><div class="card"><div class="flex items-center gap-12"><span style="width:8px;height:8px;border-radius:50%;background:var(--terra);display:inline-block"></span><p class="label-up" style="color:var(--terra)">Alertas de Ausência</p></div><p class="metric-md mt-12">3 crianças com 2+ faltas seguidas:</p><div class="alert-list mt-12"><p>• Davi (Turma da Tarde)</p><p>• João Miguel (Turma da Tarde)</p><p>• Mariana (Turma da Manhã)</p></div></div><div class="card"><p class="label-up">Síntese do Ciclo</p><div class="flex-col gap-12 mt-12"><div class="metric-row"><span class="k">Folhas completas</span><span class="v">8 de 10</span></div><hr class="hr"><div class="metric-row"><span class="k">Olhares registrados</span><span class="v">42</span></div></div></div></div></div>${dock("hoje")}</div>`;bindDock();}
function telaMais(){const isCoord=state.user?.papelKey==="coordenacao"||state.user?.papel==="Coordenação";app.innerHTML=`<div class="screen"><div class="scroll">${statusBar()}<div class="pad" style="padding-top:20px"><h1 class="h-welcome">Mais</h1><p class="sub mt-8">A casa guarda o que importa.</p></div><div class="pad mt-16 flex-col gap-12"><button type="button" class="profile-card" data-nav="entrada"><div class="avatar">↩</div><div class="info"><div class="name">Trocar de pessoa</div><div class="role">Voltar para a entrada</div></div><span class="chevron">${ICONS.chevron}</span></button>${isCoord?`<button type="button" class="profile-card" data-nav="painel"><div class="avatar musgo">▦</div><div class="info"><div class="name">Painel da casa</div><div class="role">Presença, alertas e síntese</div></div><span class="chevron">${ICONS.chevron}</span></button>`:""}</div></div>${dock("mais")}</div>`;bindNav();bindDock();}
function bindNav(){app.querySelectorAll("[data-nav]").forEach(el=>el.addEventListener("click",()=>go(el.getAttribute("data-nav"))));}
function bindDock(){app.querySelectorAll(".dock-item").forEach(el=>el.addEventListener("click",()=>{const id=el.getAttribute("data-go");const isCoord=state.user?.papel==="Coordenação"||state.user?.papelKey==="coordenacao";if(id==="hoje")go(isCoord?"painel":"hoje");else if(id==="chamada")go("chamada");else if(id==="turma")go("turma");else if(id==="mais")go("mais");}));}
function go(tela){const map={entrada:telaEntrada,hoje:telaHoje,chamada:telaChamada,folha:telaFolha,olhar:telaOlhar,turma:telaTurma,painel:telaPainel,mais:telaMais};(map[tela]||telaEntrada)();window.scrollTo(0,0);}
window.go=go;window.state=state;go("entrada");
  </script>
</body>
</html>
